<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">When propellant savings offset added mass</title>
  <desc id="figure-description">Illustrative mass comparison for a 500 to 1,000 kilometre coplanar orbit relocation. The hydrazine reference retains 120 kilograms and has specific impulse 220 seconds. The bipropellant reference has specific impulse 290 seconds and retains 120 kilograms plus the added mass on the horizontal axis. The vertical axis is bipropellant initial mass minus hydrazine initial mass. The line starts at minus 3.92 kilograms and crosses zero at 3.575 kilograms of extra retained mass. Below the crossing the bipropellant spacecraft starts lighter; above it, heavier. Retained mass includes dry hardware and retained consumables. This is not an equipment estimate or Aeterna performance result.</desc>
