<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="hall-title hall-description">
  <title id="hall-title">Maximum mass after relocation</title>
  <desc id="hall-description">Illustrative Hall propulsion resource screen for a circular coplanar 500 to 1,000 kilometre relocation. Assumed specific impulse is 1,400 seconds and efficiency is 30 percent at the complete propulsion electrical input. Continuous firing and zero other time overhead are optimistic bounds, not established operation. The 30-day maximum mass after relocation rises from 85.49 kilograms at 200 watts to 427.47 kilograms at 1,000 watts. The 48-hour maximum rises from 5.70 to 28.50 kilograms over those power points, below the 100 kilogram common-hardware mass alone. The vertical axis includes all spacecraft mass remaining after relocation: the common bus and payload, propulsion and additional power/thermal hardware, and unspent consumables. It is not payload alone or dry mass only. Specific impulse and efficiency are fixed; thrust increases with actual operating input power. These hypothetical, separately sized operating points are not one device's throttle range. A ceiling above 100 kilograms does not prove a feasible spacecraft or mission.</desc>
  <metadata>{"assumed_complete_input_efficiency": 0.3, "assumed_operating_availability": 1.0, "assumed_other_overhead_days": 0.0, "assumed_total_propellant_isp_s": 1400.0, "checkpoints_mass_ceiling_kg_by_days_then_watts": {"2.0": {"1000": 28.49767595550132, "200": 5.6995351911002645}, "30.0": {"1000": 427.4651393325198, "200": 85.49302786650398}}, "common_hardware_mass_only_kg": 100.0, "complete_input_power_range_w": [100, 1000], "deadlines_days": [30.0, 2.0], "delta_v_m_s": 262.4695436105533, "fixed_and_variable_parameters": "Specific impulse and efficiency are held fixed. Thrust increases with actual operating input power.", "mass_definition": "All spacecraft mass remaining after relocation: common bus and payload, propulsion/power/thermal hardware, and unspent consumables. Not payload alone or dry mass only.", "model": "series_04_reference_cases.py", "status": "Published illustrative calculation; optimistic resource screen, not mission feasibility"}</metadata>
