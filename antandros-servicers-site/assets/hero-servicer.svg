<svg width="960" height="760" viewBox="0 0 960 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Servicer spacecraft inspecting a cooperative client satellite</title>
  <desc id="desc">A stylized non-contact inspection spacecraft holds near a cooperative client satellite with approach corridor, hold points, and scan beams.</desc>
  <defs>
    <linearGradient id="cyanGold" x1="174" y1="124" x2="778" y2="634" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70E1FF"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="panel" x1="232" y1="274" x2="814" y2="482" gradientUnits="userSpaceOnUse">
      <stop stop-color="#163352"/>
      <stop offset="1" stop-color="#0B192B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="760" rx="42" fill="#07111F"/>
  <g opacity="0.36">
    <circle cx="168" cy="122" r="2" fill="#EDF7FF"/>
    <circle cx="278" cy="88" r="1.6" fill="#EDF7FF"/>
    <circle cx="382" cy="156" r="1.8" fill="#EDF7FF"/>
    <circle cx="738" cy="118" r="2" fill="#EDF7FF"/>
    <circle cx="838" cy="246" r="1.8" fill="#EDF7FF"/>
    <circle cx="144" cy="614" r="1.8" fill="#EDF7FF"/>
    <circle cx="276" cy="670" r="2" fill="#EDF7FF"/>
    <circle cx="736" cy="654" r="1.8" fill="#EDF7FF"/>
    <circle cx="834" cy="584" r="2.2" fill="#EDF7FF"/>
  </g>

  <ellipse cx="500" cy="386" rx="338" ry="172" stroke="#70E1FF" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="10 14"/>
  <ellipse cx="500" cy="386" rx="252" ry="122" stroke="#FFD166" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="7 12"/>
  <path d="M210 394C302 286 468 250 618 300" stroke="#70E1FF" stroke-opacity="0.34" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 16"/>
  <path d="M744 316C693 304 656 303 617 300" stroke="#FFD166" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 12" opacity="0.55"/>

  <g filter="url(#soft)">
    <!-- Client satellite -->
    <g transform="translate(579 246) rotate(5)">
      <rect x="70" y="94" width="136" height="108" rx="20" fill="#10243A" stroke="#A9BFD6" stroke-opacity="0.55" stroke-width="3"/>
      <rect x="92" y="118" width="92" height="64" rx="12" fill="#0A1729" stroke="#70E1FF" stroke-opacity="0.48" stroke-width="2"/>
      <circle cx="138" cy="150" r="17" fill="#70E1FF" fill-opacity="0.16" stroke="#70E1FF" stroke-width="3"/>
      <path d="M138 133V167M121 150H155" stroke="#70E1FF" stroke-width="3" stroke-linecap="round"/>
      <rect x="-88" y="116" width="140" height="64" rx="10" fill="url(#panel)" stroke="#70E1FF" stroke-opacity="0.30" stroke-width="2"/>
      <path d="M-62 116V180M-28 116V180M6 116V180M40 116V180" stroke="#70E1FF" stroke-opacity="0.24" stroke-width="2"/>
      <rect x="224" y="116" width="140" height="64" rx="10" fill="url(#panel)" stroke="#70E1FF" stroke-opacity="0.30" stroke-width="2"/>
      <path d="M250 116V180M284 116V180M318 116V180M352 116V180" stroke="#70E1FF" stroke-opacity="0.24" stroke-width="2"/>
      <path d="M52 150H70M206 150H224" stroke="#A9BFD6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="138" cy="92" r="8" fill="#FFD166" filter="url(#glow)"/>
      <path d="M138 92L138 50" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Servicer spacecraft -->
    <g transform="translate(170 324) rotate(-8)">
      <path d="M122 50L220 92L122 134L34 94L122 50Z" fill="#0D2138" stroke="url(#cyanGold)" stroke-width="3"/>
      <path d="M122 50V134" stroke="#70E1FF" stroke-opacity="0.45" stroke-width="3"/>
      <path d="M34 94L122 134L220 92" stroke="#A9BFD6" stroke-opacity="0.40" stroke-width="2"/>
      <circle cx="134" cy="94" r="24" fill="#70E1FF" fill-opacity="0.15" stroke="#70E1FF" stroke-width="3"/>
      <circle cx="134" cy="94" r="8" fill="#70E1FF" filter="url(#glow)"/>
      <path d="M220 92L318 74L318 118L220 100" stroke="#70E1FF" stroke-opacity="0.70" stroke-width="2" fill="#70E1FF" fill-opacity="0.05"/>
      <path d="M78 122L22 180M166 122L204 188" stroke="#A9BFD6" stroke-width="5" stroke-linecap="round"/>
      <rect x="-28" y="168" width="92" height="40" rx="9" fill="#132B46" stroke="#70E1FF" stroke-opacity="0.33" stroke-width="2"/>
      <rect x="176" y="174" width="92" height="40" rx="9" fill="#132B46" stroke="#70E1FF" stroke-opacity="0.33" stroke-width="2"/>
      <path d="M-10 168V208M18 168V208M46 168V208M194 174V214M222 174V214M250 174V214" stroke="#70E1FF" stroke-opacity="0.22" stroke-width="2"/>
    </g>
  </g>

  <!-- Scan cone and hold point labels -->
  <path d="M392 407C458 358 529 330 628 312" stroke="#70E1FF" stroke-width="2" stroke-opacity="0.65"/>
  <path d="M395 424C486 400 556 380 645 362" stroke="#70E1FF" stroke-width="2" stroke-opacity="0.38"/>
  <path d="M392 389C488 320 568 292 648 276" stroke="#70E1FF" stroke-width="2" stroke-opacity="0.38"/>
  <circle cx="438" cy="386" r="12" fill="#07111F" stroke="#FFD166" stroke-width="4" filter="url(#glow)"/>
  <circle cx="548" cy="337" r="10" fill="#07111F" stroke="#70E1FF" stroke-width="4" filter="url(#glow)"/>
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="388" y="455" width="154" height="40" rx="20" fill="#081323" stroke="#FFD166" stroke-opacity="0.44"/>
    <text x="410" y="481" fill="#FFD166">Hold point</text>
    <rect x="548" y="230" width="180" height="40" rx="20" fill="#081323" stroke="#70E1FF" stroke-opacity="0.44"/>
    <text x="570" y="256" fill="#70E1FF">Cooperative cue</text>
  </g>
</svg>
