<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Antandros mark</title>
  <desc id="desc">Abstract spacecraft servicing mark with orbital geometry and cooperative target nodes.</desc>
  <defs>
    <linearGradient id="g" x1="26" y1="24" x2="130" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70E1FF"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="42" fill="#07111F"/>
  <path d="M80 22L129.3 51.5V108.5L80 138L30.7 108.5V51.5L80 22Z" stroke="url(#g)" stroke-width="6"/>
  <path d="M49 102L80 41L111 102H94.2L88.4 89.5H61.6L55.8 102H49Z" fill="url(#g)"/>
  <path d="M67.2 76H82.7L75 59.5L67.2 76Z" fill="#07111F"/>
  <circle cx="121" cy="82" r="7" fill="#70E1FF" filter="url(#glow)"/>
  <circle cx="38" cy="82" r="5" fill="#FFD166" filter="url(#glow)"/>
  <path d="M38 82C55 112 101 112 121 82" stroke="#A9BFD6" stroke-width="3" stroke-dasharray="5 7" opacity="0.75"/>
</svg>
